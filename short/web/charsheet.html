<!doctype html><html><body style="margin:0;background:#cfe0ee">
<canvas id="c" width="2400" height="2200"></canvas>
<script type="module">
import * as T from "./toon.js"; import * as C from "./castdefs.js";
const g = document.getElementById("c").getContext("2d");
g.fillStyle = "#e9dcc0"; g.fillRect(0, 0, 2400, 2200);
const cell = (i, j, fn) => { g.save(); g.translate(i * 480 - 60, j * 1080 + 40); g.scale(0.8, 0.8); fn(new T.Pen(g)); g.restore(); };
cell(0, 0, (p) => T.stickFront(p, C.THIEF, { expr: "shock", armL: "carry", armR: "carry", prop: "chair", seed: 3 }));
cell(1, 0, (p) => T.stickFront(p, C.CAPTAIN, { expr: "angry", armR: "hold", prop: "lantern", armL: "hip", seed: 5 }));
cell(2, 0, (p) => T.stickFront(p, C.MAYOR, { expr: "worried", armL: "cheek", armR: "cheek", seed: 7 }));
cell(3, 0, (p) => T.stickFront(p, C.BAKER, { expr: "grin", armR: "torch", prop: "torch", seed: 9 }));
cell(4, 0, (p) => T.stickFront(p, C.WOMAN, { expr: "ooh", armR: "point", turn: 0.5, seed: 11 }));
cell(0, 1, (p) => T.stickSide(p, C.THIEF, { mode: "sneak", phase: 0.2, arm: "carry", prop: "chair", expr: "sly", seed: 3 }));
cell(1, 1, (p) => T.stickSide(p, C.CAPTAIN, { mode: "run", phase: 0.65, arm: "hold", prop: "lantern", expr: "angry", seed: 5 }));
cell(2, 1, (p) => T.stickFront(p, C.KID, { expr: "happy", armL: "present", armR: "present", prop: "box", boxOpen: 0.8, seed: 13 }));
cell(3, 1, (p) => T.stickFront(p, C.THIEF_SHOP, { expr: "soft", armR: "work", prop: "mallet", propT: 0.3, armL: "hip", seed: 3 }));
cell(4, 1, (p) => T.stickFront(p, C.MAYOR_NIGHT, { expr: "sleep", seed: 7, capT: 1 }));
window.done = true;
</script></body></html>
